<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WeatherBoard</title>
    <meta
      name="description"
      content="Current conditions, a 5-day forecast and a daily morning reminder for the cities you care about."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Warm up API connections so the first search/forecast skips DNS + TLS. -->
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.openweathermap.org" />
    <link rel="dns-prefetch" href="https://wft-geo-db.p.rapidapi.com" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var p = JSON.parse(localStorage.getItem('wb:prefs') || '{}')
        var t = p.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
